apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redirection-operator.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "redirection-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    operator:
      defaultMaxHosts: {{ .Values.operator.defaultMaxHosts }}
      defaultTLSEnabled: {{ .Values.operator.defaultTLSEnabled }}
      defaultIngressClass: {{ .Values.operator.defaultIngressClass | quote }}
      leaderElection:
        enabled: {{ .Values.operator.leaderElection.enabled }}
        leaseDuration: {{ .Values.operator.leaderElection.leaseDuration | quote }}
        renewDeadline: {{ .Values.operator.leaderElection.renewDeadline | quote }}
        retryPeriod: {{ .Values.operator.leaderElection.retryPeriod | quote }}
      reconciliation:
        redirectionRequeueAfter: {{ .Values.operator.reconciliation.redirectionRequeueAfter | quote }}
        domainBindingRequeueAfter: {{ .Values.operator.reconciliation.domainBindingRequeueAfter | quote }}
      certificates:
        maxCertsPerWeek: {{ .Values.operator.certificates.maxCertsPerWeek }}
        rateLimitBuffer: {{ .Values.operator.certificates.rateLimitBuffer }}
    logging:
      level: {{ .Values.logging.level | quote }}
      development: {{ .Values.logging.development }}
      encoder: {{ .Values.logging.encoder | quote }}