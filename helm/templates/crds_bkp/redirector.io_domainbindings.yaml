{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.9.2
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: domainbindings.redirector.io
  labels:
    {{- include "redirection-operator.labels" . | nindent 4 }}
spec:
  group: redirector.io
  names:
    kind: DomainBinding
    listKind: DomainBindingList
    plural: domainbindings
    singular: domainbinding
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: DomainBinding is the Schema for the domainbindings API
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            description: DomainBindingSpec defines the desired state of DomainBinding
            properties:
              annotations:
                additionalProperties:
                  type: string
                type: object
              destination:
                type: string
              ingressClass:
                type: string
              maxHosts:
                type: integer
              parentDomain:
                type: string
              sources:
                items:
                  type: string
                type: array
              tlsEnabled:
                type: boolean
            required:
            - destination
            - maxHosts
            - parentDomain
            - sources
            - tlsEnabled
            type: object
          status:
            description: DomainBindingStatus defines the observed state of DomainBinding
            properties:
              certRequestCountThisWeek:
                type: integer
              certificateRef:
                type: string
              ingressRef:
                type: string
              lastCertIssuedTime:
                format: date-time
                type: string
              lastParentDomainUpdateTime:
                format: date-time
                type: string
              lastShardUpdateTime:
                format: date-time
                type: string
              message:
                type: string
              nextCertAllowedTime:
                format: date-time
                type: string
              parentDomainUpdateCount:
                type: integer
              ready:
                type: boolean
              shardIndex:
                type: integer
              shardUpdateCount:
                type: integer
              sources:
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Parent Domain
      type: string
      description: Parent domain
      jsonPath: .spec.parentDomain
    - name: Shard
      type: integer
      description: Shard index
      jsonPath: .status.shardIndex
    - name: Sources
      type: integer
      description: Number of sources in shard
      jsonPath: .spec.sources
    - name: Destination
      type: string
      description: Destination domain
      jsonPath: .spec.destination
    - name: Ready
      type: boolean
      description: Ready status
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}