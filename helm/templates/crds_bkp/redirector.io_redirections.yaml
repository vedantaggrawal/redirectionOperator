{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.9.2
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: redirections.redirector.io
  labels:
    {{- include "redirection-operator.labels" . | nindent 4 }}
spec:
  group: redirector.io
  names:
    kind: Redirection
    listKind: RedirectionList
    plural: redirections
    singular: redirection
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Redirection is the Schema for the redirections API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation of an object.'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this object represents.'
            type: string
          metadata:
            type: object
          spec:
            description: RedirectionSpec defines the desired state of Redirection
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: Custom annotations to add to generated Ingress objects
                type: object
              destination:
                description: Destination domain where traffic should be redirected
                type: string
              ingressClass:
                description: IngressClass to use for generated Ingress objects
                type: string
              maxHosts:
                description: Maximum number of hosts per shard (default {{ .Values.operator.defaultMaxHosts }})
                type: integer
                minimum: 1
                maximum: 100
              sources:
                description: List of source domains to redirect from
                items:
                  type: string
                  pattern: '^[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?)*$'
                type: array
                minItems: 1
              tlsEnabled:
                description: Whether to enable TLS/HTTPS (default {{ .Values.operator.defaultTLSEnabled }})
                type: boolean
            required:
            - destination
            - sources
            type: object
          status:
            description: RedirectionStatus defines the observed state of Redirection
            properties:
              message:
                type: string
              parentDomains:
                items:
                  properties:
                    domain:
                      type: string
                    shardCount:
                      type: integer
                    sourceCount:
                      type: integer
                  required:
                  - domain
                  - shardCount
                  - sourceCount
                  type: object
                type: array
              ready:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Sources
      type: integer
      description: Number of source domains
      jsonPath: .status.parentDomains[*].sourceCount
    - name: Destination
      type: string
      description: Destination domain
      jsonPath: .spec.destination
    - name: Ready
      type: boolean
      description: Ready status
      jsonPath: .status.ready
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
{{- end }}