{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "redirection-operator.clusterRoleBindingName" . }}
  labels:
    {{- include "redirection-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "redirection-operator.clusterRoleName" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "redirection-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}