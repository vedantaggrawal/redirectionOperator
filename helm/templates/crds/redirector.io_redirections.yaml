{{- if .Values.crds.install }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.9.2
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    {{- end }}
  name: redirections.redirector.io
  labels:
    {{- include "redirection-operator.labels" . | nindent 4 }}
spec:
  group: redirector.io
  names:
    kind: Redirection
    listKind: RedirectionList
    plural: redirections
    singular: redirection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.totalSources
      name: Sources
      type: integer
    - jsonPath: .spec.destination
      name: Destination
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Redirection is the Schema for the redirections API
        properties:
          apiVersion:
            description: 'APIVersion defines the versioned schema of this representation
              of an object.'
            type: string
          kind:
            description: 'Kind is a string value representing the REST resource this
              object represents.'
            type: string
          metadata:
            type: object
          spec:
            description: RedirectionSpec defines the desired state of Redirection
            properties:
              destination:
                description: Destination is the target domain to redirect to
                type: string
              maxHosts:
                description: MaxHosts is the maximum number of hosts per TLS certificate
                  group (default: 10)
                type: integer
              sources:
                description: Sources is the list of domains to redirect from
                items:
                  type: string
                type: array
            required:
            - destination
            - sources
            type: object
          status:
            description: RedirectionStatus defines the observed state of Redirection
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of an object's state
                items:
                  description: "Condition contains details for one aspect of the current
                    state of this API Resource."
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition
                        transitioned from one status to another.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating
                        details about the transition.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation
                        that the condition was set based upon.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating
                        the reason for the condition's last transition.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastUpdated:
                description: LastUpdated shows when the redirection was last processed
                format: date-time
                type: string
              parentDomains:
                description: ParentDomains shows the computed parent domains
                items:
                  type: string
                type: array
              totalSources:
                description: TotalSources shows the total number of source domains
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}